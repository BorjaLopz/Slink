[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Level packs change on every content push; never let a phone keep a stale manifest.
[[headers]]
  for = "/levels/*"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed bundles are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
